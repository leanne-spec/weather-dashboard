<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌤️ Weather Dashboard</h1>
      <p>Real-time weather information</p>
    </header>

    <div class="search-section">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name..." 
        class="search-input"
      >
      <button id="searchBtn" class="search-btn">Search</button>
      <button id="locationBtn" class="location-btn">📍 Use My Location</button>
    </div>

    <div id="loadingSpinner" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Loading weather data...</p>
    </div>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <div id="weatherContainer" class="weather-container">
      <div class="weather-card">
        <div class="weather-header">
          <h2 id="cityName">Enter a city name</h2>
          <p id="lastUpdate" class="last-update"></p>
        </div>
        <div class="weather-main">
          <div class="temperature-section">
            <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon">
            <div>
              <div id="temperature" class="temperature">--°C</div>
              <div id="description" class="description">--</div>
            </div>
          </div>
        </div>
        <div class="weather-details">
          <div class="detail-item">
            <span class="detail-label">Feels Like</span>
            <span id="feelsLike" class="detail-value">--°C</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value">--%</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span id="wind" class="detail-value">-- m/s</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Pressure</span>
            <span id="pressure" class="detail-value">-- hPa</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Visibility</span>
            <span id="visibility" class="detail-value">-- km</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Cloudiness</span>
            <span id="cloudiness" class="detail-value">--%</span>
          </div>
        </div>
        <div class="sun-times">
          <div class="sun-item">
            <span>🌅 Sunrise</span>
            <span id="sunrise" class="sun-time">--:--</span>
          </div>
          <div class="sun-item">
            <span>🌇 Sunset</span>
            <span id="sunset" class="sun-time">--:--</span>
          </div>
        </div>
      </div>
    </div>

    <div id="forecastContainer" class="forecast-container" style="display: none;">
      <h3>5-Day Forecast</h3>
      <div id="forecastCards" class="forecast-cards"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
